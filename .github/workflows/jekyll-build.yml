name: jekyll build

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # Reads Gemfile.lock and installs the exact pinned versions,
    # caching them between CI runs (bundler-cache: true).
    # Respects .bundle/config (gems go into vendor/bundle, no sudo needed).
    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.3'
        bundler-cache: true

    - name: jekyll build
      run: bundle exec jekyll build --trace

    - name: trigger update
      env:
        DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
      run: 'curl -fL -H "X-Deploy-Token: ${DEPLOY_TOKEN}" ${{ secrets.NEW_UPDATE_URL }}'
