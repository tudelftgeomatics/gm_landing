name: jekyll build

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # Installs Ruby 3.3 and puts `gem`/`jekyll` on the PATH
    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.3'

    # Pin the version so CI builds identically to local/server builds
    - name: install jekyll
      run: gem install jekyll -v 4.3.4

    - name: jekyll build
      run: jekyll build --trace

    - name: trigger update
      env:
        DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
      run: 'curl -fL ${{ secrets.UPDATE_URL }}'
